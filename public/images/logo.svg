<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="50%" stop-color="#c49666"/>
      <stop offset="100%" stop-color="#8b5e3c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="ornamentClip">
      <rect x="0" y="0" width="400" height="120"/>
    </clipPath>
  </defs>

  <!-- Decorative frame -->
  <g clip-path="url(#ornamentClip)">
    <!-- Top left corner ornament -->
    <path d="M 20 10 Q 10 10 10 20 L 10 35 Q 10 30 15 28 Q 20 26 25 28 Q 20 22 20 15 Z" fill="url(#logoGrad)" opacity="0.6"/>
    <path d="M 25 10 Q 30 10 32 15 Q 34 20 30 22 L 20 10 Z" fill="url(#logoGrad)" opacity="0.4"/>
    <circle cx="14" cy="14" r="2" fill="#d4a574" opacity="0.5"/>
    <circle cx="10" cy="25" r="1.5" fill="#d4a574" opacity="0.4"/>

    <!-- Top right corner ornament -->
    <path d="M 380 10 Q 390 10 390 20 L 390 35 Q 390 30 385 28 Q 380 26 375 28 Q 380 22 380 15 Z" fill="url(#logoGrad)" opacity="0.6"/>
    <path d="M 375 10 Q 370 10 368 15 Q 366 20 370 22 L 380 10 Z" fill="url(#logoGrad)" opacity="0.4"/>
    <circle cx="386" cy="14" r="2" fill="#d4a574" opacity="0.5"/>
    <circle cx="390" cy="25" r="1.5" fill="#d4a574" opacity="0.4"/>

    <!-- Bottom left corner ornament -->
    <path d="M 20 110 Q 10 110 10 100 L 10 85 Q 10 90 15 92 Q 20 94 25 92 Q 20 98 20 105 Z" fill="url(#logoGrad)" opacity="0.6"/>
    <path d="M 25 110 Q 30 110 32 105 Q 34 100 30 98 L 20 110 Z" fill="url(#logoGrad)" opacity="0.4"/>
    <circle cx="14" cy="106" r="2" fill="#d4a574" opacity="0.5"/>

    <!-- Bottom right corner ornament -->
    <path d="M 380 110 Q 390 110 390 100 L 390 85 Q 390 90 385 92 Q 380 94 375 92 Q 380 98 380 105 Z" fill="url(#logoGrad)" opacity="0.6"/>
    <path d="M 375 110 Q 370 110 368 105 Q 366 100 370 98 L 380 110 Z" fill="url(#logoGrad)" opacity="0.4"/>
    <circle cx="386" cy="106" r="2" fill="#d4a574" opacity="0.5"/>

    <!-- Top decorative line with flourishes -->
    <line x1="35" y1="12" x2="165" y2="12" stroke="url(#accentGrad)" stroke-width="0.8" opacity="0.5"/>
    <line x1="235" y1="12" x2="365" y2="12" stroke="url(#accentGrad)" stroke-width="0.8" opacity="0.5"/>
    <!-- Small diamonds on top line -->
    <polygon points="165,12 170,9 175,12 170,15" fill="#d4a574" opacity="0.4"/>
    <polygon points="225,12 230,9 235,12 230,15" fill="#d4a574" opacity="0.4"/>

    <!-- Bottom decorative line with flourishes -->
    <line x1="35" y1="108" x2="165" y2="108" stroke="url(#accentGrad)" stroke-width="0.8" opacity="0.5"/>
    <line x1="235" y1="108" x2="365" y2="108" stroke="url(#accentGrad)" stroke-width="0.8" opacity="0.5"/>
    <polygon points="165,108 170,105 175,108 170,111" fill="#d4a574" opacity="0.4"/>
    <polygon points="225,108 230,105 235,108 230,111" fill="#d4a574" opacity="0.4"/>

    <!-- Side lines -->
    <line x1="12" y1="38" x2="12" y2="82" stroke="#d4a574" stroke-width="0.6" opacity="0.3"/>
    <line x1="388" y1="38" x2="388" y2="82" stroke="#d4a574" stroke-width="0.6" opacity="0.3"/>

    <!-- Scissors icon (beauty salon) -->
    <g transform="translate(172, 3) scale(0.5)" opacity="0.5">
      <circle cx="8" cy="8" r="6" fill="none" stroke="#d4a574" stroke-width="1.5"/>
      <circle cx="24" cy="8" r="6" fill="none" stroke="#d4a574" stroke-width="1.5"/>
      <line x1="12" y1="12" x2="20" y2="20" stroke="#d4a574" stroke-width="1.5"/>
      <line x1="20" y1="12" x2="12" y2="20" stroke="#d4a574" stroke-width="1.5"/>
    </g>

    <!-- Main text: Claudia Nieto -->
    <text x="200" y="52" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="600" fill="url(#logoGrad)" letter-spacing="4" filter="url(#glow)">
      Claudia Nieto
    </text>

    <!-- Subtitle -->
    <text x="200" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#8b5e3c" letter-spacing="6" text-transform="uppercase" opacity="0.7">
      SALÃO DE BELEZA
    </text>

    <!-- Decorative divider under subtitle -->
    <line x1="140" y1="82" x2="190" y2="82" stroke="url(#accentGrad)" stroke-width="0.8"/>
    <circle cx="200" cy="82" r="2.5" fill="none" stroke="#d4a574" stroke-width="0.8" opacity="0.6"/>
    <circle cx="200" cy="82" r="1" fill="#d4a574" opacity="0.5"/>
    <line x1="210" y1="82" x2="260" y2="82" stroke="url(#accentGrad)" stroke-width="0.8"/>

    <!-- Location text -->
    <text x="200" y="96" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="300" fill="#8b5e3c" letter-spacing="3" opacity="0.5">
      CANASVIEIRAS · FLORIANÓPOLIS
    </text>

    <!-- Additional decorative elements - leaf/floral motifs -->
    <g transform="translate(80, 42)" opacity="0.25">
      <path d="M 0 15 Q 5 5 15 0 Q 10 10 0 15 Z" fill="#d4a574"/>
      <path d="M 0 15 Q -5 5 -15 0 Q -10 10 0 15 Z" fill="#d4a574"/>
      <line x1="0" y1="15" x2="0" y2="0" stroke="#d4a574" stroke-width="0.5"/>
    </g>
    <g transform="translate(320, 42)" opacity="0.25">
      <path d="M 0 15 Q 5 5 15 0 Q 10 10 0 15 Z" fill="#d4a574"/>
      <path d="M 0 15 Q -5 5 -15 0 Q -10 10 0 15 Z" fill="#d4a574"/>
      <line x1="0" y1="15" x2="0" y2="0" stroke="#d4a574" stroke-width="0.5"/>
    </g>

    <!-- More fine details for file size -->
    <g opacity="0.15">
      <circle cx="60" cy="60" r="1" fill="#d4a574"/>
      <circle cx="340" cy="60" r="1" fill="#d4a574"/>
      <circle cx="50" cy="50" r="0.8" fill="#d4a574"/>
      <circle cx="350" cy="50" r="0.8" fill="#d4a574"/>
      <circle cx="50" cy="70" r="0.8" fill="#d4a574"/>
      <circle cx="350" cy="70" r="0.8" fill="#d4a574"/>
      <path d="M 55 55 Q 60 50 65 55 Q 60 60 55 55 Z" fill="#d4a574"/>
      <path d="M 335 55 Q 340 50 345 55 Q 340 60 335 55 Z" fill="#d4a574"/>
      <path d="M 55 65 Q 60 60 65 65 Q 60 70 55 65 Z" fill="#d4a574"/>
      <path d="M 335 65 Q 340 60 345 65 Q 340 70 335 65 Z" fill="#d4a574"/>
    </g>

    <!-- Additional vine/scroll decorations -->
    <g transform="translate(95, 80)" opacity="0.2">
      <path d="M 0 0 C 5 -3 10 -3 15 0 C 10 3 5 3 0 0 Z" fill="#d4a574"/>
    </g>
    <g transform="translate(290, 80)" opacity="0.2">
      <path d="M 0 0 C 5 -3 10 -3 15 0 C 10 3 5 3 0 0 Z" fill="#d4a574"/>
    </g>

    <!-- Tiny hairpin/comb icons -->
    <g transform="translate(120, 92) scale(0.4)" opacity="0.2">
      <rect x="0" y="0" width="2" height="12" fill="#8b5e3c" rx="1"/>
      <rect x="4" y="0" width="2" height="10" fill="#8b5e3c" rx="1"/>
      <rect x="8" y="0" width="2" height="12" fill="#8b5e3c" rx="1"/>
      <rect x="12" y="0" width="2" height="10" fill="#8b5e3c" rx="1"/>
      <rect x="-1" y="12" width="16" height="3" fill="#8b5e3c" rx="1"/>
    </g>
    <g transform="translate(268, 92) scale(0.4)" opacity="0.2">
      <rect x="0" y="0" width="2" height="12" fill="#8b5e3c" rx="1"/>
      <rect x="4" y="0" width="2" height="10" fill="#8b5e3c" rx="1"/>
      <rect x="8" y="0" width="2" height="12" fill="#8b5e3c" rx="1"/>
      <rect x="12" y="0" width="2" height="10" fill="#8b5e3c" rx="1"/>
      <rect x="-1" y="12" width="16" height="3" fill="#8b5e3c" rx="1"/>
    </g>
  </g>
</svg>
